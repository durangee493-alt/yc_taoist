<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇-全难度挑战</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; color: white; }
        .menu { text-align: center; background: rgba(0,0,0,0.3); padding: 25px; border-radius: 20px; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #2ecc71; font-size: 22px; }
        
        /* 按钮组样式 */
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .diff-item { display: flex; flex-direction: column; align-items: center; }
        .diff-btn { width: 100%; padding: 12px; border: none; border-radius: 15px; cursor: pointer; font-size: 16px; font-weight: bold; color: white; transition: 0.2s; position: relative; }
        .diff-btn:active { transform: scale(0.98); }
        
        /* 难度颜色 */
        .hard { background: #e74c3c; }
        .normal { background: #f39c12; }
        .easy { background: #2ecc71; }
        .slow { background: #3498db; }

        /* 最高分小字样式 */
        .best-tag { font-size: 12px; margin-top: 4px; color: #f1c40f; font-weight: bold; }

        /* 游戏界面 */
        canvas { border: 5px solid #ecf0f1; background: #000; display: none; margin-top: 10px; max-width: 90vw; }
        .score-board { font-size: 20px; margin-bottom: 10px; display: none; width: 300px; justify-content: space-between; }
        .controls { display: none; grid-template-columns: repeat(3, 60px); grid-gap: 15px; margin-top: 20px; }
        .btn { width: 60px; height: 60px; background: #34495e; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

    <div id="menu" class="menu">
        <h2>🐍 贪吃蛇挑战赛</h2>
        <div class="btn-group">
            <div class="diff-item">
                <button class="diff-btn hard" onclick="startGame(80, '高手')">高手模式 (极速)</button>
                <div class="best-tag">最高分: <span id="best_高手">0</span></div>
            </div>
            <div class="diff-item">
                <button class="diff-btn normal" onclick="startGame(130, '普通')">普通模式 (标准)</button>
                <div class="best-tag">最高分: <span id="best_普通">0</span></div>
            </div>
            <div class="diff-item">
                <button class="diff-btn easy" onclick="startGame(200, '新手')">新手模式 (推荐)</button>
                <div class="best-tag">最高分: <span id="best_新手">0</span></div>
            </div>
            <div class="diff-item">
                <button class="diff-btn slow" onclick="startGame(350, '慢速')">慢速模式 (悠闲)</button>
                <div class="best-tag">最高分: <span id="best_慢速">0</span></div>
            </div>
        </div>
    </div>

    <div id="gameHeader" class="score-board">
        <span>分数: <b id="currentScore">0</b></span>
        <span style="color:#f1c40f">当前难度最高: <b id="displayBest">0</b></span>
    </div>

    <canvas id="snakeGame" width="300" height="300"></canvas>

    <div id="controls" class="controls">
        <div style="grid-column: 2" class="btn" onclick="changeDir('UP')">▲</div>
        <div style="grid-column: 1" class="btn" onclick="changeDir('LEFT')">◀</div>
        <div style="grid-column: 2" class="btn" onclick="changeDir('DOWN')">▼</div>
        <div style="grid-column: 3" class="btn" onclick="changeDir('RIGHT')">▶</div>
    </div>

<script>
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const box = 15;
    let score = 0, d = "RIGHT", gameLoop, currentDiffLabel = "";
    let snake = [{x: 10 * box, y: 10 * box}];
    let food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };

    // 页面初始化：读取并显示所有难度的最高分
    const difficulties = ['高手', '普通', '新手', '慢速'];
    difficulties.forEach(diff => {
        const val = localStorage.getItem('snakeBest_' + diff) || 0;
        document.getElementById('best_' + diff).innerText = val;
    });

    function startGame(speed, diffLabel) {
        currentDiffLabel = diffLabel;
        const savedBest = localStorage.getItem('snakeBest_' + diffLabel) || 0;
        
        document.getElementById('menu').style.display = 'none';
        document.getElementById('gameHeader').style.display = 'flex';
        document.getElementById('controls').style.display = 'grid';
        document.getElementById('displayBest').innerText = savedBest;
        canvas.style.display = 'block';
        gameLoop = setInterval(draw, speed);
    }

    // 方向控制逻辑
    document.addEventListener("keydown", (e) => {
        if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(e.keyCode == 38 && d != "DOWN") d = "UP";
        else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(e.keyCode == 40 && d != "UP") d = "DOWN";
    });

    function changeDir(n) {
        if(n == 'LEFT' && d != 'RIGHT') d = 'LEFT';
        if(n == 'UP' && d != 'DOWN') d = 'UP';
        if(n == 'RIGHT' && d != 'LEFT') d = 'RIGHT';
        if(n == 'DOWN' && d != 'UP') d = 'DOWN';
    }

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "#2ecc71" : "#ecf0f1";
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
        }

        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(food.x, food.y, box, box);

        let sX = snake[0].x, sY = snake[0].y;
        if( d == "LEFT") sX -= box;
        if( d == "UP") sY -= box;
        if( d == "RIGHT") sX += box;
        if( d == "DOWN") sY += box;

        if(sX == food.x && sY == food.y) {
            score++;
            document.getElementById('currentScore').innerText = score;
            food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
        } else {
            snake.pop();
        }

        let newHead = {x: sX, y: sY};

        if(sX < 0 || sX >= canvas.width || sY < 0 || sY >= canvas.height || collision(newHead, snake)) {
            clearInterval(gameLoop);
            const oldBest = localStorage.getItem('snakeBest_' + currentDiffLabel) || 0;
            if(score > oldBest) {
                localStorage.setItem('snakeBest_' + currentDiffLabel, score);
                alert("🎉 新纪录！你在[" + currentDiffLabel + "]模式获得了 " + score + " 分！");
            } else {
                alert("游戏结束！得分: " + score);
            }
            location.reload(); 
        }
        snake.unshift(newHead);
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }
</script>
</body>
</html>
